<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="喀什：清真寺穹顶与馕插画">
  <!-- Wanderlist 插画规范：米色底 #f6efe2 / 主线 #9c4a2f / 点缀 #d9a441，手绘线稿风 -->
  <rect width="800" height="500" fill="#f6efe2"/>
  <!-- 馕（当作太阳） -->
  <g stroke="#9c4a2f" stroke-linecap="round">
    <circle cx="656" cy="128" r="52" fill="#d9a441" stroke-width="5"/>
    <circle cx="656" cy="128" r="30" fill="none" stroke-width="4" stroke-dasharray="3 10"/>
    <g stroke-width="4">
      <circle cx="646" cy="120" r="1.5"/>
      <circle cx="666" cy="118" r="1.5"/>
      <circle cx="656" cy="134" r="1.5"/>
      <circle cx="644" cy="140" r="1.5"/>
      <circle cx="668" cy="138" r="1.5"/>
    </g>
  </g>

  <!-- 地面 -->
  <path d="M 60 452 Q 400 444 740 452" fill="none" stroke="#9c4a2f" stroke-width="5" stroke-linecap="round"/>
  <path d="M 120 470 Q 260 466 390 470" fill="none" stroke="#9c4a2f" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="2 18" opacity="0.5"/>

  <!-- 艾提尕尔清真寺 -->
  <g stroke="#9c4a2f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左宣礼塔 -->
    <g fill="none">
      <path d="M 176 450 L 184 232 L 208 232 L 216 450"/>
      <path d="M 180 232 Q 196 204 212 232" fill="#d9a441"/>
      <line x1="196" y1="208" x2="196" y2="190"/>
      <path d="M 202 182 A 9 9 0 1 1 200 168 A 7.5 7.5 0 1 0 202 182 Z" fill="#9c4a2f" stroke="none"/>
      <line x1="182" y1="300" x2="210" y2="300" stroke-width="4"/>
      <line x1="180" y1="368" x2="212" y2="368" stroke-width="4"/>
    </g>
    <!-- 右宣礼塔 -->
    <g fill="none">
      <path d="M 584 450 L 592 232 L 616 232 L 624 450"/>
      <path d="M 588 232 Q 604 204 620 232" fill="#d9a441"/>
      <line x1="604" y1="208" x2="604" y2="190"/>
      <path d="M 610 182 A 9 9 0 1 1 608 168 A 7.5 7.5 0 1 0 610 182 Z" fill="#9c4a2f" stroke="none"/>
      <line x1="590" y1="300" x2="618" y2="300" stroke-width="4"/>
      <line x1="588" y1="368" x2="620" y2="368" stroke-width="4"/>
    </g>
    <!-- 主体门楼 -->
    <g fill="none">
      <path d="M 300 450 L 300 262 L 500 262 L 500 450"/>
      <!-- 中央穹顶 -->
      <path d="M 348 262 Q 340 196 400 178 Q 460 196 452 262" fill="#d9a441"/>
      <line x1="400" y1="176" x2="400" y2="152"/>
      <path d="M 408 144 A 11 11 0 1 1 406 126 A 9 9 0 1 0 408 144 Z" fill="#9c4a2f" stroke="none"/>
      <!-- 尖拱门 -->
      <path d="M 358 450 L 358 344 Q 400 308 442 344 L 442 450"/>
      <path d="M 372 450 L 372 352 Q 400 328 428 352 L 428 450" stroke-width="4"/>
      <!-- 门楣装饰 -->
      <line x1="316" y1="288" x2="484" y2="288" stroke-width="4" stroke-dasharray="2 12"/>
    </g>
    <!-- 两侧老城拱门矮墙 -->
    <g fill="none" stroke-width="5">
      <path d="M 236 450 L 236 386 L 300 386"/>
      <path d="M 254 450 L 254 416 Q 268 404 282 416 L 282 450" stroke-width="4"/>
      <path d="M 500 386 L 564 386 L 564 450"/>
      <path d="M 518 450 L 518 416 Q 532 404 546 416 L 546 450" stroke-width="4"/>
    </g>
  </g>

  <!-- 白杨树 -->
  <g fill="none" stroke="#d9a441" stroke-width="5" stroke-linecap="round">
    <line x1="108" y1="452" x2="108" y2="330"/>
    <path d="M 108 336 Q 88 306 104 260 Q 122 300 108 336 Z" fill="#d9a441"/>
    <line x1="700" y1="452" x2="700" y2="350"/>
    <path d="M 700 356 Q 682 330 696 290 Q 712 326 700 356 Z" fill="#d9a441"/>
  </g>
</svg>
