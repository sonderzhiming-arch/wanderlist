<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="清迈：兰纳佛塔与天灯插画">
  <!-- Wanderlist 插画规范：米色底 #f6efe2 / 主线 #9c4a2f / 点缀 #d9a441，手绘线稿风 -->
  <rect width="800" height="500" fill="#f6efe2"/>
  <!-- 远山（素贴山） -->
  <path d="M 50 430 Q 180 330 300 415 Q 430 320 560 412 Q 670 350 760 428"
        fill="none" stroke="#9c4a2f" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <!-- 地面 -->
  <path d="M 70 452 Q 400 444 730 452" fill="none" stroke="#9c4a2f" stroke-width="5" stroke-linecap="round"/>
  <path d="M 360 470 Q 500 466 640 470" fill="none" stroke="#9c4a2f" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="2 18" opacity="0.5"/>

  <!-- 兰纳式佛塔（双龙寺金塔） -->
  <g stroke="#9c4a2f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 塔尖华盖 -->
    <g fill="none">
      <line x1="330" y1="128" x2="330" y2="58"/>
      <path d="M 306 76 Q 330 62 354 76"/>
      <circle cx="330" cy="52" r="6" fill="#d9a441"/>
    </g>
    <!-- 锥形相轮（金色） -->
    <path d="M 330 128 L 296 216 Q 330 228 364 216 Z" fill="#d9a441"/>
    <g fill="none" stroke-width="4">
      <line x1="312" y1="158" x2="348" y2="158"/>
      <line x1="304" y1="186" x2="356" y2="186"/>
    </g>
    <!-- 覆钟形塔身（金色） -->
    <path d="M 296 216 Q 240 258 248 316 L 412 316 Q 420 258 364 216 Q 330 228 296 216 Z" fill="#d9a441"/>
    <path d="M 252 292 Q 330 306 408 292" fill="none" stroke-width="4"/>
    <!-- 基座三层 -->
    <g fill="none">
      <path d="M 236 316 L 424 316 L 424 348 L 236 348 Z"/>
      <path d="M 218 348 L 442 348 L 442 386 L 218 386 Z"/>
      <path d="M 196 386 L 464 386 L 464 450 L 196 450"/>
      <line x1="330" y1="392" x2="330" y2="444" stroke-dasharray="1 14" stroke-width="4"/>
    </g>
    <!-- 基座两侧小伞盖 -->
    <g fill="none" stroke-width="4">
      <line x1="228" y1="348" x2="228" y2="308"/>
      <path d="M 214 314 Q 228 304 242 314"/>
      <line x1="432" y1="348" x2="432" y2="308"/>
      <path d="M 418 314 Q 432 304 446 314"/>
    </g>
  </g>

  <!-- 天灯 -->
  <g stroke="#9c4a2f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <g fill="#d9a441">
      <path d="M 586 118 Q 586 84 612 84 Q 638 84 638 118 Q 638 142 630 150 L 594 150 Q 586 142 586 118 Z"/>
      <path d="M 668 216 Q 668 188 689 188 Q 710 188 710 216 Q 710 235 704 241 L 674 241 Q 668 235 668 216 Z"/>
      <path d="M 566 268 Q 566 246 582 246 Q 598 246 598 268 Q 598 283 593 288 L 571 288 Q 566 283 566 268 Z"/>
    </g>
    <g fill="none" stroke-width="4">
      <line x1="600" y1="150" x2="602" y2="162"/>
      <line x1="624" y1="150" x2="622" y2="162"/>
      <circle cx="612" cy="166" r="3"/>
    </g>
  </g>

  <!-- 三角旗（夜市） -->
  <g stroke="#9c4a2f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 60 120 Q 150 158 250 138" fill="none"/>
    <path d="M 92 134 l 10 24 l 16 -18 z" fill="#d9a441"/>
    <path d="M 148 148 l 8 24 l 17 -16 z" fill="none"/>
    <path d="M 202 148 l 7 22 l 16 -17 z" fill="#d9a441"/>
  </g>
</svg>
