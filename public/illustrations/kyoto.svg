<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="京都：五重塔与竹林插画">
  <!-- Wanderlist 插画规范：米色底 #f6efe2 / 主线 #9c4a2f / 点缀 #d9a441，手绘线稿风 -->
  <rect width="800" height="500" fill="#f6efe2"/>
  <!-- 落日 -->
  <circle cx="180" cy="150" r="52" fill="#d9a441" opacity="0.85"/>
  <!-- 远山 -->
  <path d="M 60 432 Q 200 350 330 420 Q 470 340 620 418 Q 700 380 750 425"
        fill="none" stroke="#9c4a2f" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <!-- 地面 -->
  <path d="M 70 452 Q 400 444 730 452" fill="none" stroke="#9c4a2f" stroke-width="5" stroke-linecap="round"/>
  <path d="M 150 470 Q 300 466 430 470" fill="none" stroke="#9c4a2f" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="2 18" opacity="0.5"/>

  <!-- 五重塔（八坂之塔剪影线稿） -->
  <g fill="none" stroke="#9c4a2f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 相轮塔尖 -->
    <line x1="330" y1="118" x2="330" y2="62"/>
    <line x1="316" y1="104" x2="344" y2="104"/>
    <line x1="318" y1="88" x2="342" y2="88"/>
    <line x1="321" y1="74" x2="339" y2="74"/>
    <!-- 第五层屋檐 -->
    <path d="M 262 158 Q 330 138 398 158 L 404 148 M 262 158 L 256 148"/>
    <line x1="292" y1="160" x2="296" y2="196"/>
    <line x1="368" y1="160" x2="364" y2="196"/>
    <!-- 第四层屋檐 -->
    <path d="M 240 210 Q 330 188 420 210 L 427 199 M 240 210 L 233 199"/>
    <line x1="276" y1="213" x2="280" y2="252"/>
    <line x1="384" y1="213" x2="380" y2="252"/>
    <!-- 第三层屋檐 -->
    <path d="M 218 266 Q 330 242 442 266 L 450 254 M 218 266 L 210 254"/>
    <line x1="260" y1="269" x2="264" y2="312"/>
    <line x1="400" y1="269" x2="396" y2="312"/>
    <!-- 第二层屋檐 -->
    <path d="M 196 326 Q 330 300 464 326 L 473 313 M 196 326 L 187 313"/>
    <line x1="243" y1="329" x2="247" y2="376"/>
    <line x1="417" y1="329" x2="413" y2="376"/>
    <!-- 第一层屋檐与塔身 -->
    <path d="M 172 390 Q 330 362 488 390 L 498 376 M 172 390 L 162 376"/>
    <line x1="226" y1="393" x2="228" y2="450"/>
    <line x1="434" y1="393" x2="432" y2="450"/>
    <!-- 一层门与柱 -->
    <path d="M 306 450 L 306 408 Q 330 398 354 408 L 354 450"/>
  </g>

  <!-- 竹林 -->
  <g fill="none" stroke="#d9a441" stroke-width="7" stroke-linecap="round">
    <line x1="596" y1="96" x2="600" y2="452"/>
    <line x1="650" y1="70" x2="652" y2="452"/>
    <line x1="702" y1="110" x2="704" y2="452"/>
    <!-- 竹节 -->
    <g stroke-width="4">
      <line x1="590" y1="170" x2="606" y2="168"/>
      <line x1="592" y1="260" x2="608" y2="258"/>
      <line x1="594" y1="352" x2="610" y2="350"/>
      <line x1="644" y1="140" x2="660" y2="138"/>
      <line x1="645" y1="238" x2="661" y2="236"/>
      <line x1="646" y1="336" x2="662" y2="334"/>
      <line x1="696" y1="192" x2="712" y2="190"/>
      <line x1="698" y1="290" x2="714" y2="288"/>
      <line x1="699" y1="384" x2="715" y2="382"/>
    </g>
    <!-- 竹叶 -->
    <g stroke-width="5">
      <path d="M 600 118 Q 630 96 662 92"/>
      <path d="M 652 96 Q 676 76 706 72"/>
      <path d="M 598 130 Q 574 114 548 112"/>
      <path d="M 702 132 Q 728 116 754 116"/>
      <path d="M 650 182 Q 622 168 596 168"/>
    </g>
  </g>

  <!-- 飘落的枫叶 -->
  <g fill="#9c4a2f" opacity="0.8">
    <path d="M 508 200 l 7 -14 l 7 14 l 14 3 l -11 10 l 3 15 l -13 -7 l -13 7 l 3 -15 l -11 -10 z"/>
    <path d="M 540 300 l 5 -10 l 5 10 l 10 2 l -8 8 l 2 11 l -9 -5 l -9 5 l 2 -11 l -8 -8 z" opacity="0.6"/>
    <path d="M 120 300 l 5 -10 l 5 10 l 10 2 l -8 8 l 2 11 l -9 -5 l -9 5 l 2 -11 l -8 -8 z" opacity="0.7"/>
  </g>
</svg>
